<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese HSK Vocab Master - Unified</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --skip: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      width: 100%;
      max-width: 580px;
      padding: 2rem;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-align: left;
    }

    /* Selection Screen Grid */
    .grid-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .select-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 0.5rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .select-btn:hover {
      border-color: var(--accent);
    }

    .select-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .btn-full-width {
      grid-column: span 2;
    }

    /* Top Mode Selector inside active game */
    .mode-bar {
      display: flex;
      gap: 0.35rem;
      background: #0f172a;
      padding: 0.35rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .mode-btn {
      flex: 1;
      padding: 0.55rem 0.5rem;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .badge {
      background: var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      color: var(--accent);
    }

    .word-display {
      text-align: center;
      margin: 1.2rem 0;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main-prompt {
      font-size: 3.5rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .main-prompt.english-mode {
      font-size: 1.8rem;
    }

    .sub-prompt {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .hint-toggle-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }

    .pos-tag {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--muted);
      background: #0f172a;
      padding: 0.2rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      margin-top: 0.3rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 0.75rem;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1.25rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    input[type="text"].error-shake {
      border-color: var(--wrong);
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-skip {
      background: var(--border);
      color: var(--muted);
    }

    .btn-skip:hover {
      color: #fff;
      background: #475569;
    }

    .feedback {
      text-align: center;
      min-height: 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .feedback.wrong { color: var(--wrong); }
    .feedback.info { color: var(--skip); }
    .feedback.correct { color: var(--correct); }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Results */
    .stat-box {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-item span {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }

    .stat-item strong {
      font-size: 1.4rem;
    }

    .review-box {
      margin-top: 1rem;
      text-align: left;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      background: #0f172a;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .review-item {
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- Screen 1: Initial Selection Screen -->
    <div id="setup-screen">
      <h2 style="color: var(--accent); margin-bottom: 1.2rem; text-align: center;">HSK Practice Setup</h2>
      
      <div class="section-title">1. Select Vocabulary Module</div>
      <div class="grid-select">
        <button type="button" class="select-btn active" data-type="module" data-val="mod1">Module 1 (88 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod2">Module 2 (77 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod3">Module 3 (60 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="all">All Modules (225 Words)</button>
      </div>

      <div class="section-title">2. Select Game Mode</div>
      <div class="grid-select">
        <button type="button" class="select-btn active" data-type="mode" data-val="pinyin">1. Type Pinyin</button>
        <button type="button" class="select-btn" data-type="mode" data-val="meaning">2. Type Meaning</button>
        <button type="button" class="select-btn btn-full-width" data-type="mode" data-val="hanzi">3. Type Hanzi Recall</button>
      </div>

      <button class="action-btn btn-submit" style="width: 100%; padding: 1rem; margin-top: 0.5rem;" onclick="startConfiguredGame()">Start Training</button>
    </div>

    <!-- Screen 2: Active Gameplay Screen -->
    <div id="play-screen" style="display: none;">
      <div class="mode-bar">
        <button class="mode-btn" id="tab-pinyin" onclick="switchModeInGame('pinyin')">Pinyin</button>
        <button class="mode-btn" id="tab-meaning" onclick="switchModeInGame('meaning')">Meaning</button>
        <button class="mode-btn" id="tab-hanzi" onclick="switchModeInGame('hanzi')">Hanzi</button>
      </div>

      <div class="header">
        <div>Progress: <span class="badge" id="progress-text">0 / 0</span></div>
        <div>Time: <span class="badge" id="timer-text">00:00</span></div>
        <div>Score: <span class="badge" id="score-text">0</span></div>
      </div>

      <div class="word-display">
        <div class="main-prompt" id="main-prompt">...</div>
        <div class="sub-prompt" id="sub-prompt"></div>
        <div class="pos-tag" id="pos-tag">...</div>
      </div>

      <div class="feedback" id="feedback-text"></div>

      <div class="input-group">
        <input type="text" id="answer-input" placeholder="Type answer..." autocomplete="off" />
        <div class="btn-row">
          <button class="action-btn btn-skip" type="button" onclick="handleSkip()">Skip Word</button>
          <button class="action-btn btn-submit" type="button" onclick="checkAnswer()">Submit</button>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Screen 3: Results Screen -->
    <div id="results-screen" style="display: none; text-align: center;">
      <h2 style="color: var(--accent); margin-bottom: 1.25rem;">Session Complete! 🎉</h2>
      
      <div class="stat-box">
        <div class="stat-item">
          <span>Correct</span>
          <strong style="color: var(--correct);" id="final-correct">0</strong>
        </div>
        <div class="stat-item">
          <span>Skipped</span>
          <strong style="color: var(--wrong);" id="final-skipped">0</strong>
        </div>
        <div class="stat-item">
          <span>Total Time</span>
          <strong style="color: var(--accent);" id="final-time">00:00</strong>
        </div>
      </div>

      <div id="review-wrapper" style="display:none;">
        <div class="section-title">Words to Review:</div>
        <div class="review-box" id="review-list"></div>
      </div>

      <div class="btn-row">
        <button class="action-btn btn-skip" onclick="showSetupScreen()">Change Setup</button>
        <button class="action-btn btn-submit" onclick="startConfiguredGame()">Play Again</button>
      </div>
    </div>

  </div>

      { hanzi: "经历", pinyin: "jīnglì", pos: "n./v.", displayAnswer: "experience / go through", answers: ["experience", "go through", "undergo"] },
      { hanzi: "酸", pinyin: "suān", pos: "adj.", displayAnswer: "sour / acid", answers: ["sour", "acid", "acidic", "tart", "sore"] },
      { hanzi: "苦", pinyin: "kǔ", pos: "adj.", displayAnswer: "bitter / hardship", answers: ["bitter", "hardship", "painful", "hard"] },
      { hanzi: "辣", pinyin: "là", pos: "adj.", displayAnswer: "hot / spicy", answers: ["hot", "spicy", "pungent"] },
      { hanzi: "深厚", pinyin: "shēnhòu", pos: "adj.", displayAnswer: "deep / profound", answers: ["deep", "profound", "solid", "deep-seated"] },
      { hanzi: "重视", pinyin: "zhòngshì", pos: "v.", displayAnswer: "attach importance to / value", answers: ["attach importance to", "value", "pay attention to", "take seriously", "prize"] },

    ];

    // State
    let selectedModule = "mod1";
    let selectedMode = "pinyin";
    let deck = [];
    let currentIndex = 0;
    let score = 0;
    let skipped = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isWaitingNext = false;
    let hadErrorOnCurrentWord = false;
    let missedWords = [];
    let isHintVisible = false;

    // Selection buttons logic
    document.querySelectorAll('.select-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        const val = btn.dataset.val;
        document.querySelectorAll(`.select-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'module') selectedModule = val;
        if (type === 'mode') selectedMode = val;
      });
    });

    // Helper functions
    function normalizePinyin(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ɡ/g, "g")
        .replace(/ɑ/g, "a")
        .replace(/ü/g, "v")
        .replace(/\s+/g, "")
        .trim();
    }

    function cleanEnglish(str) {
      return str
        .toLowerCase()
        .replace(/^(to|a|an|the|be)\s+/, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();
    }

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, () => []);
      for (let i = 0; i <= b.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function isCloseMatchEnglish(userInput, acceptedList) {
      const cleanUser = cleanEnglish(userInput);
      if (!cleanUser) return false;
      for (const target of acceptedList) {
        const cleanTarget = cleanEnglish(target);
        if (!cleanTarget) continue;
        if (cleanUser === cleanTarget || cleanTarget.includes(cleanUser) || cleanUser.includes(cleanTarget)) return true;
        const dist = levenshtein(cleanUser, cleanTarget);
        if (cleanTarget.length >= 4 && dist <= 1) return true;
        if (cleanTarget.length >= 7 && dist <= 2) return true;
      }
      return false;
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const secs = (totalSeconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      document.getElementById("timer-text").textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById("timer-text").textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function showSetupScreen() {
      clearInterval(timerInterval);
      document.getElementById("setup-screen").style.display = "block";
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "none";
    }

    function startConfiguredGame() {
      let rawList = [];
      if (selectedModule === 'mod1') rawList = MODULE_1;
      else if (selectedModule === 'mod2') rawList = MODULE_2;
      else if (selectedModule === 'mod3') rawList = MODULE_3;
      else if (selectedModule === 'all') {
        const seen = new Set();
        rawList = [...MODULE_1, ...MODULE_2, ...MODULE_3].filter(item => {
          if (seen.has(item.hanzi)) return false;
          seen.add(item.hanzi);
          return true;
        });
      }

      deck = shuffle(rawList);
      currentIndex = 0;
      score = 0;
      skipped = 0;
      hadErrorOnCurrentWord = false;
      missedWords = [];

      document.getElementById("setup-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "none";
      document.getElementById("play-screen").style.display = "block";
      document.getElementById("score-text").textContent = "0";

      updateModeTabsUI();
      startTimer();
      loadCard();
    }

    function switchModeInGame(newMode) {
      selectedMode = newMode;
      updateModeTabsUI();
      loadCard();
    }

    function updateModeTabsUI() {
      ['pinyin', 'meaning', 'hanzi'].forEach(m => {
        const tab = document.getElementById(`tab-${m}`);
        if (tab) tab.classList.toggle('active', m === selectedMode);
      });
    }

    function toggleHint() {
      isHintVisible = !isHintVisible;
      const hintSpan = document.getElementById('hint-span');
      const toggleBtn = document.getElementById('hint-toggle-btn');
      if (isHintVisible) {
        hintSpan.style.display = 'inline';
        toggleBtn.textContent = 'Hide Pinyin';
      } else {
        hintSpan.style.display = 'none';
        toggleBtn.textContent = 'Show Pinyin Hint';
      }
    }

    function loadCard() {
      if (currentIndex >= deck.length) {
        endGame();
        return;
      }

      isWaitingNext = false;
      hadErrorOnCurrentWord = false;
      isHintVisible = false;

      const current = deck[currentIndex];
      const mainPrompt = document.getElementById("main-prompt");
      const subPrompt = document.getElementById("sub-prompt");
      const posTag = document.getElementById("pos-tag");
      const answerInput = document.getElementById("answer-input");
      const feedbackText = document.getElementById("feedback-text");

      posTag.textContent = current.pos || "vocab";
      document.getElementById("progress-text").textContent = `${currentIndex + 1} / ${deck.length}`;
      
      const pct = (currentIndex / deck.length) * 100;
      document.getElementById("progress-fill").style.width = `${pct}%`;

      feedbackText.textContent = "";
      feedbackText.className = "feedback";
      answerInput.value = "";
      answerInput.disabled = false;
      answerInput.classList.remove('error-shake');

      if (selectedMode === "pinyin") {
        mainPrompt.className = "main-prompt";
        mainPrompt.textContent = current.hanzi;
        subPrompt.textContent = current.displayAnswer;
        answerInput.placeholder = "Type pinyin (e.g. nanshou)...";
      } else if (selectedMode === "meaning") {
        mainPrompt.className = "main-prompt";
        mainPrompt.textContent = current.hanzi;
        subPrompt.textContent = current.pinyin;
        answerInput.placeholder = "Type English translation...";
      } else if (selectedMode === "hanzi") {
        mainPrompt.className = "main-prompt english-mode";
        mainPrompt.textContent = current.displayAnswer;
        subPrompt.innerHTML = `
          <span id="hint-span" style="display:none; font-weight:600;">Pinyin: ${current.pinyin}</span><br>
          <button type="button" class="hint-toggle-btn" id="hint-toggle-btn" onclick="toggleHint()">Show Pinyin Hint</button>
        `;
        answerInput.placeholder = "输入汉字 (Type Chinese)...";
      }

      answerInput.focus();
    }

    function checkAnswer() {
      if (isWaitingNext) return;
      const inputVal = document.getElementById("answer-input").value.trim();
      if (!inputVal) return;

      const current = deck[currentIndex];
      const feedback = document.getElementById("feedback-text");
      const input = document.getElementById("answer-input");
      let isCorrect = false;

      if (selectedMode === "pinyin") {
        const userClean = normalizePinyin(inputVal);
        const targetClean = normalizePinyin(current.pinyinRaw || current.pinyin);
        isCorrect = (userClean === targetClean) || 
                    (targetClean.includes('v') && userClean === targetClean.replace(/v/g, 'u'));
      } else if (selectedMode === "meaning") {
        isCorrect = isCloseMatchEnglish(inputVal, current.answers);
      } else if (selectedMode === "hanzi") {
        isCorrect = inputVal.replace(/[\s\p{P}]/gu, "") === current.hanzi.replace(/[\s\p{P}]/gu, "");
      }

      if (isCorrect) {
        if (!hadErrorOnCurrentWord) {
          score++;
          document.getElementById("score-text").textContent = score;
        }
        feedback.className = "feedback correct";
        feedback.innerHTML = `✓ Correct!<br><span style="font-size:0.85rem; font-weight:normal;"><strong>${current.hanzi}</strong> (${current.pinyin}): ${current.displayAnswer}</span>`;
        
        isWaitingNext = true;
        input.disabled = true;
        setTimeout(() => {
          currentIndex++;
          loadCard();
        }, 900);
      } else {
        if (!hadErrorOnCurrentWord) {
          missedWords.push(current);
        }
        hadErrorOnCurrentWord = true;
        feedback.className = "feedback wrong";
        feedback.textContent = selectedMode === 'meaning' 
          ? "✗ Not quite right, check spelling or try another synonym!" 
          : selectedMode === 'hanzi' 
          ? "✗ Incorrect character, try again!" 
          : "✗ Incorrect pinyin, try again!";
        
        input.classList.remove('error-shake');
        void input.offsetWidth;
        input.classList.add('error-shake');
        input.select();
      }
    }

    function handleSkip() {
      if (isWaitingNext) return;
      skipped++;
      const current = deck[currentIndex];
      if (!hadErrorOnCurrentWord) {
        missedWords.push(current);
      }

      const feedback = document.getElementById("feedback-text");
      feedback.className = "feedback info";
      feedback.innerHTML = `Answer: <strong>${current.hanzi}</strong> | <strong>${current.pinyin}</strong> (${current.displayAnswer})`;
      
      isWaitingNext = true;
      document.getElementById("answer-input").disabled = true;
      setTimeout(() => {
        currentIndex++;
        loadCard();
      }, 1500);
    }

    function endGame() {
      clearInterval(timerInterval);
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "block";

      document.getElementById("final-correct").textContent = score;
      document.getElementById("final-skipped").textContent = skipped;
      document.getElementById("final-time").textContent = formatTime(secondsElapsed);
      document.getElementById("progress-fill").style.width = "100%";

      const reviewWrapper = document.getElementById("review-wrapper");
      const reviewList = document.getElementById("review-list");
      if (missedWords.length > 0) {
        reviewList.innerHTML = missedWords.map(item => `
          <div class="review-item">
            <strong>${item.hanzi}</strong> (${item.pinyin}): ${item.displayAnswer}
          </div>
        `).join('');
        reviewWrapper.style.display = "block";
      } else {
        reviewWrapper.style.display = "none";
      }
    }

    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer();
    });
  </script>
