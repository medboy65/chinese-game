<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chinese HSK Vocab Master - Unified</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --skip: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      width: 100%;
      max-width: 600px;
      padding: 1.5rem;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    @media (min-width: 640px) {
      .game-card {
        padding: 2rem;
      }
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-align: left;
    }

    .grid-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .select-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 0.5rem;
      border-radius: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .select-btn:hover {
      border-color: var(--accent);
    }

    .select-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .btn-full-width {
      grid-column: span 2;
    }

    .mode-bar {
      display: flex;
      gap: 0.35rem;
      background: #0f172a;
      padding: 0.35rem;
      border-radius: 0.75rem;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    .mode-btn {
      flex: 1;
      padding: 0.55rem 0.4rem;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      color: var(--muted);
      gap: 0.4rem;
    }

    .badge {
      background: var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
      color: var(--accent);
    }

    .word-display {
      text-align: center;
      margin: 1rem 0;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main-prompt {
      font-size: clamp(2.4rem, 9vw, 3.5rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      word-break: break-word;
    }

    .main-prompt.english-mode {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    input[type="text"].error-shake {
      border-color: var(--wrong);
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .btn-row {
      display: flex;
      gap: 0.65rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      touch-action: manipulation;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-skip {
      background: var(--border);
      color: var(--muted);
    }

    .btn-skip:hover {
      color: #fff;
      background: #475569;
    }

    .speaking-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .mic-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: #0f172a;
      color: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
      touch-action: manipulation;
    }

    .mic-btn:hover {
      transform: scale(1.05);
      background: rgba(56, 189, 248, 0.1);
    }

    .mic-btn.listening {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #ffffff;
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .mic-hint {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .heard-transcription {
      font-size: 1.1rem;
      color: #fff;
      min-height: 1.6rem;
      font-weight: 500;
    }

    .feedback {
      text-align: center;
      min-height: 2.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .feedback.wrong { color: var(--wrong); }
    .feedback.info { color: var(--skip); }
    .feedback.correct { color: var(--correct); }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stat-box {
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.25rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-item span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 0.3rem;
    }

    .stat-item strong {
      font-size: 1.25rem;
    }

    .result-section {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .result-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .result-title.skipped-title {
      color: var(--skip);
    }

    .result-title.self-corrected-title {
      color: var(--accent);
    }

    .review-box {
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.65rem;
      background: #0f172a;
      font-size: 0.85rem;
    }

    .review-item {
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .review-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- Screen 1: Initial Selection Screen -->
    <div id="setup-screen">
      <h2 style="color: var(--accent); margin-bottom: 1.2rem; text-align: center; font-size: 1.5rem;">HSK Practice Setup</h2>
      
      <div class="section-title">1. Select Vocabulary Module</div>
      <div class="grid-select">
        <button type="button" class="select-btn" data-type="module" data-val="mod1">Module 1 (88 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod2">Module 2 (77 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod3">Module 3 (60 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod4">Module 4 (47 Words)</button>
        <button type="button" class="select-btn" data-type="module" data-val="mod5">Module 5 (30 Words)</button>
        <button type="button" class="select-btn active" data-type="module" data-val="mod6">Module 6 - New (60 Words)</button>
        <button type="button" class="select-btn btn-full-width" data-type="module" data-val="all">All Modules (362 Words)</button>
      </div>

      <div class="section-title">2. Select Game Mode</div>
      <div class="grid-select">
        <button type="button" class="select-btn active" data-type="mode" data-val="pinyin">1. Type Pinyin</button>
        <button type="button" class="select-btn" data-type="mode" data-val="meaning">2. Type Meaning</button>
        <button type="button" class="select-btn" data-type="mode" data-val="hanzi">3. Type Hanzi</button>
        <button type="button" class="select-btn" data-type="mode" data-val="speaking">4. Speak Hanzi 🎙️</button>
      </div>

      <button class="action-btn btn-submit" style="width: 100%; padding: 0.95rem; margin-top: 0.5rem;" onclick="startConfiguredGame()">Start Training</button>
    </div>

    <!-- Screen 2: Active Gameplay Screen -->
    <div id="play-screen" style="display: none;">
      <div class="mode-bar">
        <button class="mode-btn" id="tab-pinyin" onclick="switchModeInGame('pinyin')">Pinyin</button>
        <button class="mode-btn" id="tab-meaning" onclick="switchModeInGame('meaning')">Meaning</button>
        <button class="mode-btn" id="tab-hanzi" onclick="switchModeInGame('hanzi')">Hanzi</button>
        <button class="mode-btn" id="tab-speaking" onclick="switchModeInGame('speaking')">Speak</button>
      </div>

      <div class="header">
        <div>Progress: <span class="badge" id="progress-text">0 / 0</span></div>
        <div>Time: <span class="badge" id="timer-text">00:00</span></div>
        <div>Score: <span class="badge" id="score-text">0</span></div>
      </div>

      <div class="word-display">
        <div class="main-prompt" id="main-prompt">...</div>
      </div>

      <div class="feedback" id="feedback-text"></div>

      <!-- Text Inputs for Typing Modes -->
      <div class="input-group" id="text-input-section">
        <input type="text" id="answer-input" placeholder="Type answer..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <div class="btn-row">
          <button class="action-btn btn-skip" type="button" onclick="handleSkip()">Skip Word</button>
          <button class="action-btn btn-submit" type="button" onclick="checkAnswer()">Submit</button>
        </div>
      </div>

      <!-- Speaking UI Section -->
      <div id="speaking-section" style="display: none;">
        <div class="speaking-container">
          <button type="button" class="mic-btn" id="mic-btn" onclick="toggleSpeechRecognition()">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
          <span class="mic-hint" id="mic-status-label">Tap microphone to speak</span>
          <div class="heard-transcription" id="transcription-text"></div>
        </div>
        <div class="btn-row">
          <button class="action-btn btn-skip" type="button" onclick="handleSkip()">Skip Word</button>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Screen 3: Results Screen -->
    <div id="results-screen" style="display: none; text-align: center;">
      <h2 style="color: var(--accent); margin-bottom: 1.25rem; font-size: 1.5rem;">Session Complete! 🎉</h2>
      
      <div class="stat-box">
        <div class="stat-item">
          <span>First-Try Correct</span>
          <strong style="color: var(--correct);" id="final-correct">0</strong>
        </div>
        <div class="stat-item">
          <span>Skipped</span>
          <strong style="color: var(--skip);" id="final-skipped">0</strong>
        </div>
        <div class="stat-item">
          <span>Total Time</span>
          <strong style="color: var(--accent);" id="final-time">00:00</strong>
        </div>
      </div>

      <div id="skipped-wrapper" class="result-section" style="display: none;">
        <div class="result-title skipped-title">The skipped words are:</div>
        <div class="review-box" id="skipped-list"></div>
      </div>

      <div id="self-corrected-wrapper" class="result-section" style="display: none;">
        <div class="result-title self-corrected-title">The words you got wrong first and then corrected yourself:</div>
        <div class="review-box" id="self-corrected-list"></div>
      </div>

      <div class="btn-row" style="margin-top: 1.25rem;">
        <button class="action-btn btn-skip" onclick="showSetupScreen()">Change Setup</button>
        <button class="action-btn btn-submit" onclick="startConfiguredGame()">Play Again</button>
      </div>
    </div>

  </div>

  <script>
    const MODULE_1 = [

      { hanzi: "活动", pinyin: "huódòng", pinyinRaw: "huodong", pos: "n./v.", displayAnswer: "activity / event", answers: ["activity", "event", "activities", "action", "move"] },

    function normalizePinyin(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ɡ/g, "g")
        .replace(/ɑ/g, "a")
        .replace(/ü/g, "v")
        .replace(/['’\s\-]/g, "")
        .trim();
    }

    function cleanEnglish(str) {
      return str
        .toLowerCase()
        .replace(/^(to|a|an|the|be|have|have a|give a)\s+/, "")

        .trim();
    }

    function cleanChinese(str) {
      return str.replace(/[\s\p{P}]/gu, "").trim();

    function levenshtein(a, b) {
      const matrix = Array.from({ length: b.length + 1 }, () => []);
      for (let i = 0; i <= b.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function isCloseMatchEnglish(userInput, acceptedList) {
      const cleanUser = cleanEnglish(userInput);
      if (!cleanUser) return false;
      for (const target of acceptedList) {
        const cleanTarget = cleanEnglish(target);
        if (!cleanTarget) continue;
        if (cleanUser === cleanTarget || cleanTarget.includes(cleanUser) || cleanUser.includes(cleanTarget)) return true;
        const dist = levenshtein(cleanUser, cleanTarget);
        if (cleanTarget.length >= 4 && dist <= 1) return true;
        if (cleanTarget.length >= 7 && dist <= 2) return true;
      }
      return false;
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const secs = (totalSeconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      document.getElementById("timer-text").textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById("timer-text").textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function showSetupScreen() {
      stopSpeech();
      clearInterval(timerInterval);
      document.getElementById("setup-screen").style.display = "block";
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "none";
    }

    function startConfiguredGame() {
      stopSpeech();
      let rawList = [];
      if (selectedModule === 'mod1') rawList = MODULE_1;
      else if (selectedModule === 'mod2') rawList = MODULE_2;
      else if (selectedModule === 'mod3') rawList = MODULE_3;
      else if (selectedModule === 'mod4') rawList = MODULE_4;
      else if (selectedModule === 'mod5') rawList = MODULE_5;
      else if (selectedModule === 'mod6') rawList = MODULE_6;
      else if (selectedModule === 'all') {
        const seen = new Set();
        rawList = [...MODULE_1, ...MODULE_2, ...MODULE_3, ...MODULE_4, ...MODULE_5, ...MODULE_6].filter(item => {
          if (seen.has(item.hanzi)) return false;
          seen.add(item.hanzi);
          return true;
        });
      }

      deck = shuffle(rawList);
      currentIndex = 0;
      score = 0;
      hadErrorOnCurrentWord = false;
      skippedWords = [];
      selfCorrectedWords = [];

      document.getElementById("setup-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "none";
      document.getElementById("play-screen").style.display = "block";
      document.getElementById("score-text").textContent = "0";

      updateModeTabsUI();
      startTimer();
      loadCard();
    }

    function switchModeInGame(newMode) {
      stopSpeech();
      selectedMode = newMode;
      updateModeTabsUI();
      loadCard();
    }

    function updateModeTabsUI() {
      ['pinyin', 'meaning', 'hanzi', 'speaking'].forEach(m => {
        const tab = document.getElementById(`tab-${m}`);
        if (tab) tab.classList.toggle('active', m === selectedMode);
      });
    }

    function stopSpeech() {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }
    }

    function toggleSpeechRecognition() {
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome, Edge, or Safari.");
        return;
      }
      if (isListening) {
        stopSpeech();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function loadCard() {
      stopSpeech();

      if (currentIndex >= deck.length) {
        endGame();
        return;
      }

      isWaitingNext = false;
      hadErrorOnCurrentWord = false;

      const current = deck[currentIndex];
      const mainPrompt = document.getElementById("main-prompt");
      const answerInput = document.getElementById("answer-input");
      const feedbackText = document.getElementById("feedback-text");
      const textSection = document.getElementById("text-input-section");
      const speakingSection = document.getElementById("speaking-section");

      document.getElementById("progress-text").textContent = `${currentIndex + 1} / ${deck.length}`;
      
      const pct = (currentIndex / deck.length) * 100;
      document.getElementById("progress-fill").style.width = `${pct}%`;

      feedbackText.textContent = "";
      feedbackText.className = "feedback";
      answerInput.value = "";
      answerInput.disabled = false;
      answerInput.classList.remove('error-shake');

      document.getElementById("transcription-text").textContent = "";
      document.getElementById("mic-status-label").textContent = "Tap microphone to speak";

      if (selectedMode === "pinyin") {
        textSection.style.display = "flex";
        speakingSection.style.display = "none";
        mainPrompt.className = "main-prompt";
        mainPrompt.textContent = current.hanzi;
        answerInput.placeholder = "Type pinyin...";
        answerInput.focus();
      } else if (selectedMode === "meaning") {
        textSection.style.display = "flex";
        speakingSection.style.display = "none";
        mainPrompt.className = "main-prompt";
        mainPrompt.textContent = current.hanzi;
        answerInput.placeholder = "Type meaning...";
        answerInput.focus();
      } else if (selectedMode === "hanzi") {
        textSection.style.display = "flex";
        speakingSection.style.display = "none";
        mainPrompt.className = "main-prompt english-mode";
        mainPrompt.textContent = current.displayAnswer;
        answerInput.placeholder = "输入汉字 (Type Chinese)...";
        answerInput.focus();
      } else if (selectedMode === "speaking") {
        textSection.style.display = "none";
        speakingSection.style.display = "block";
        mainPrompt.className = "main-prompt";
        mainPrompt.textContent = current.hanzi;
      }
    }

    function evaluateSpokenWord(transcript) {
      if (isWaitingNext) return;
      const current = deck[currentIndex];
      const feedback = document.getElementById("feedback-text");

      const cleanUser = cleanChinese(transcript);
      const cleanTarget = cleanChinese(current.hanzi);

      const isCorrect = (cleanUser === cleanTarget) || cleanUser.includes(cleanTarget);

      if (isCorrect) {
        if (!hadErrorOnCurrentWord) {
          score++;
          document.getElementById("score-text").textContent = score;
        } else {
          if (!selfCorrectedWords.some(w => w.hanzi === current.hanzi)) {
            selfCorrectedWords.push(current);
          }
        }
        feedback.className = "feedback correct";
        feedback.innerHTML = `✓ Correct pronunciation!`;
        
        isWaitingNext = true;
        setTimeout(() => {
          currentIndex++;
          loadCard();
        }, 900);
      } else {
        hadErrorOnCurrentWord = true;
        feedback.className = "feedback wrong";
        feedback.textContent = "✗ Incorrect pronunciation, try again!";
      }
    }

    function checkAnswer() {
      if (isWaitingNext) return;
      const inputVal = document.getElementById("answer-input").value.trim();
      if (!inputVal) return;

      const current = deck[currentIndex];
      const feedback = document.getElementById("feedback-text");
      const input = document.getElementById("answer-input");
      let isCorrect = false;

      if (selectedMode === "pinyin") {
        const userClean = normalizePinyin(inputVal);
        const targetClean = normalizePinyin(current.pinyinRaw || current.pinyin);
        isCorrect = (userClean === targetClean) || 
                    (targetClean.includes('v') && userClean === targetClean.replace(/v/g, 'u'));
      } else if (selectedMode === "meaning") {
        isCorrect = isCloseMatchEnglish(inputVal, current.answers);
      } else if (selectedMode === "hanzi") {
        isCorrect = cleanChinese(inputVal) === cleanChinese(current.hanzi);
      }

      if (isCorrect) {
        if (!hadErrorOnCurrentWord) {
          score++;
          document.getElementById("score-text").textContent = score;
        } else {
          if (!selfCorrectedWords.some(w => w.hanzi === current.hanzi)) {
            selfCorrectedWords.push(current);
          }
        }
        feedback.className = "feedback correct";
        feedback.innerHTML = `✓ Correct!`;
        
        isWaitingNext = true;
        input.disabled = true;
        setTimeout(() => {
          currentIndex++;
          loadCard();
        }, 800);
      } else {
        hadErrorOnCurrentWord = true;
        feedback.className = "feedback wrong";
        feedback.textContent = "✗ Incorrect, try again!";
        
        input.classList.remove('error-shake');
        void input.offsetWidth;
        input.classList.add('error-shake');
        input.select();
      }
    }

    function handleSkip() {
      if (isWaitingNext) return;
      stopSpeech();
      const current = deck[currentIndex];
      if (!skippedWords.some(w => w.hanzi === current.hanzi)) {
        skippedWords.push(current);
      }

      const feedback = document.getElementById("feedback-text");
      feedback.className = "feedback info";
      feedback.innerHTML = `Skipped: <strong>${current.hanzi}</strong>`;
      
      isWaitingNext = true;
      document.getElementById("answer-input").disabled = true;
      setTimeout(() => {
        currentIndex++;
        loadCard();
      }, 1200);
    }

    function endGame() {
      stopSpeech();
      clearInterval(timerInterval);
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "block";

      document.getElementById("final-correct").textContent = score;
      document.getElementById("final-skipped").textContent = skippedWords.length;
      document.getElementById("final-time").textContent = formatTime(secondsElapsed);
      document.getElementById("progress-fill").style.width = "100%";

      const skippedWrapper = document.getElementById("skipped-wrapper");
      const skippedList = document.getElementById("skipped-list");
      if (skippedWords.length > 0) {
        skippedList.innerHTML = skippedWords.map(item => `
          <div class="review-item">
            <strong>${item.hanzi}</strong> (${item.pinyin}) - ${item.displayAnswer}
          </div>
        `).join('');
        skippedWrapper.style.display = "block";
      } else {
        skippedWrapper.style.display = "none";
      }

      const selfCorrectedWrapper = document.getElementById("self-corrected-wrapper");
      const selfCorrectedList = document.getElementById("self-corrected-list");
      if (selfCorrectedWords.length > 0) {
        selfCorrectedList.innerHTML = selfCorrectedWords.map(item => `
          <div class="review-item">
            <strong>${item.hanzi}</strong> (${item.pinyin}) - ${item.displayAnswer}
          </div>
        `).join('');
        selfCorrectedWrapper.style.display = "block";
      } else {
        selfCorrectedWrapper.style.display = "none";
      }
    }

    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer();
    });
  </script>
</body>
</html>
